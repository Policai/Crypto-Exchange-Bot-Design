services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: exchange
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    depends_on:
      - db
    ports:
      - "8000:8000"

  bot:
    build:
      context: .
      dockerfile: bot/Dockerfile
    env_file: .env
    depends_on:
      - backend

  webapp:
    build:
      context: .
      dockerfile: webapp/react-app/Dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - backend

  admin-panel:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
    ports:
      - "5174:5174"
    depends_on:
      - backend

volumes:
  pgdata:
